<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📚 Smart Study Scheduler</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    /* HEADER */
    header {
      text-align: center;
      padding: 30px 0 20px;
    }
    header h1 {
      font-size: 2.5rem;
      background: linear-gradient(90deg, #e94560, #0f3460, #533483);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: brightness(2);
    }
    header p { color: #aaa; margin-top: 8px; font-size: 1rem; }

    /* CARDS */
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }
    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: #e94560;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* FORM */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: #e94560;
    }
    .form-group input::placeholder { color: #666; }
    select option { background: #1a1a2e; }

    /* BUTTONS */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-add {
      background: linear-gradient(135deg, #533483, #e94560);
      color: #fff;
      white-space: nowrap;
    }
    .btn-add:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-generate {
      background: linear-gradient(135deg, #e94560, #533483);
      color: #fff;
      padding: 14px 32px;
      font-size: 1.05rem;
      width: 100%;
      border-radius: 12px;
      letter-spacing: 0.5px;
    }
    .btn-generate:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,0.4); }

    .btn-remove {
      background: rgba(233,69,96,0.2);
      color: #e94560;
      border: 1px solid rgba(233,69,96,0.3);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn-remove:hover { background: rgba(233,69,96,0.4); }

    /* COURSE LIST */
    .course-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .course-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      animation: fadeIn 0.3s ease;
    }
    .course-info { display: flex; align-items: center; gap: 12px; }
    .course-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .course-name { font-weight: 600; }
    .course-meta { font-size: 0.8rem; color: #aaa; margin-top: 2px; }
    .deadline-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(233,69,96,0.2);
      color: #e94560;
      border: 1px solid rgba(233,69,96,0.3);
    }

    /* SETTINGS */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }

    /* SCHEDULE OUTPUT */
    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .schedule-header h2 { color: #4ade80; }
    .stats { display: flex; gap: 16px; }
    .stat-pill {
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.3);
      color: #4ade80;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    /* WEEK GRID */
    .week-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .week-tab {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      font-size: 0.85rem;
      background: transparent;
      color: #aaa;
      transition: all 0.2s;
    }
    .week-tab.active {
      background: rgba(233,69,96,0.3);
      border-color: #e94560;
      color: #fff;
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .day-col { min-width: 0; }
    .day-header {
      text-align: center;
      font-size: 0.75rem;
      color: #aaa;
      padding: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .day-header.today {
      background: rgba(233,69,96,0.2);
      color: #e94560;
    }

    .session-block {
      border-radius: 10px;
      padding: 10px 8px;
      margin-bottom: 6px;
      border-left: 3px solid;
      cursor: pointer;
      transition: transform 0.15s;
      position: relative;
    }
    .session-block:hover { transform: scale(1.03); }
    .session-time {
      font-size: 0.65rem;
      opacity: 0.7;
      margin-bottom: 3px;
    }
    .session-course {
      font-size: 0.75rem;
      font-weight: 700;
      word-break: break-word;
    }
    .session-topic {
      font-size: 0.65rem;
      opacity: 0.75;
      margin-top: 2px;
    }
    .session-duration {
      font-size: 0.6rem;
      opacity: 0.6;
      margin-top: 4px;
    }
    .priority-badge {
      position: absolute;
      top: 4px; right: 4px;
      font-size: 0.55rem;
      padding: 1px 5px;
      border-radius: 10px;
    }
    .priority-high { background: rgba(239,68,68,0.3); color: #ef4444; }
    .priority-medium { background: rgba(234,179,8,0.3); color: #eab308; }
    .priority-low { background: rgba(74,222,128,0.3); color: #4ade80; }

    /* TIMELINE LIST */
    .timeline { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .timeline-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .timeline-time {
      min-width: 80px;
      font-size: 0.8rem;
      color: #aaa;
      padding-top: 2px;
    }
    .timeline-bar {
      width: 3px;
      border-radius: 2px;
      align-self: stretch;
      flex-shrink: 0;
    }
    .timeline-content {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .timeline-course { font-weight: 700; font-size: 0.95rem; }
    .timeline-detail { font-size: 0.8rem; color: #aaa; margin-top: 3px; }

    /* ALERTS */
    .alert {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .alert-warning {
      background: rgba(234,179,8,0.1);
      border: 1px solid rgba(234,179,8,0.3);
      color: #eab308;
    }
    .alert-success {
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.3);
      color: #4ade80;
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #555;
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
    .empty-state p { font-size: 1rem; }

    /* PROGRESS */
    .progress-section { margin-top: 20px; }
    .progress-item { margin-bottom: 14px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    .progress-bar-bg {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 1s ease;
    }

    /* VIEW TOGGLE */
    .view-toggle {
      display: flex;
      gap: 6px;
      background: rgba(255,255,255,0.05);
      padding: 4px;
      border-radius: 10px;
    }
    .view-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      background: transparent;
      color: #aaa;
      transition: all 0.2s;
    }
    .view-btn.active {
      background: rgba(233,69,96,0.4);
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .schedule-output { animation: slideUp 0.4s ease; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr 1fr; }
      .settings-grid { grid-template-columns: 1fr 1fr; }
      .day-grid { grid-template-columns: repeat(4, 1fr); }
      header h1 { font-size: 1.8rem; }
    }
    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
      .day-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <header>
    <h1>📚 Smart Study Scheduler</h1>
    <p>Add your courses & deadlines — get a clash-free study plan instantly</p>
  </header>

  <!-- ADD COURSES -->
  <div class="card">
    <h2>📖 Add Courses & Deadlines</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Course Name</label>
        <input type="text" id="courseName" placeholder="e.g. Mathematics" />
      </div>
      <div class="form-group">
        <label>Exam / Deadline Date</label>
        <input type="date" id="courseDeadline" />
      </div>
      <div class="form-group">
        <label>Difficulty</label>
        <select id="courseDifficulty">
          <option value="hard">🔴 Hard</option>
          <option value="medium" selected>🟡 Medium</option>
          <option value="easy">🟢 Easy</option>
        </select>
      </div>
      <button class="btn btn-add" onclick="addCourse()">➕ Add</button>
    </div>
    <div class="course-list" id="courseList"></div>
  </div>

  <!-- SETTINGS -->
  <div class="card">
    <h2>⚙️ Schedule Settings</h2>
    <div class="settings-grid">
      <div class="form-group">
        <label>Study Start Time</label>
        <input type="time" id="startTime" value="08:00" />
      </div>
      <div class="form-group">
        <label>Study End Time</label>
        <input type="time" id="endTime" value="22:00" />
      </div>
      <div class="form-group">
        <label>Session Length (minutes)</label>
        <select id="sessionLen">
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60" selected>60 min (Pomodoro)</option>
          <option value="90">90 min</option>
        </select>
      </div>
      <div class="form-group">
        <label>Break Between Sessions</label>
        <select id="breakLen">
          <option value="10">10 min</option>
          <option value="15" selected>15 min</option>
          <option value="20">20 min</option>
          <option value="30">30 min</option>
        </select>
      </div>
      <div class="form-group">
        <label>Rest Days</label>
        <select id="restDays" multiple style="height:80px;">
          <option value="0">Sunday</option>
          <option value="6" selected>Saturday</option>
        </select>
      </div>
      <div class="form-group">
        <label>Schedule Duration (weeks)</label>
        <select id="scheduleWeeks">
          <option value="1">1 Week</option>
          <option value="2" selected>2 Weeks</option>
          <option value="3">3 Weeks</option>
          <option value="4">4 Weeks</option>
        </select>
      </div>
    </div>
  </div>

  <!-- GENERATE -->
  <button class="btn btn-generate" onclick="generateSchedule()">
    ⚡ Generate My Clash-Free Study Schedule
  </button>

  <!-- OUTPUT -->
  <div id="scheduleOutput"></div>

</div>

<script>
  // ─── STATE ───────────────────────────────────────────────────────────────────
  let courses = [];
  let generatedSchedule = [];
  let currentWeek = 0;
  let currentView = 'grid';

  const COLORS = [
    { bg: 'rgba(233,69,96,0.15)', border: '#e94560', text: '#ff8fa3' },
    { bg: 'rgba(83,52,131,0.25)', border: '#a78bfa', text: '#c4b5fd' },
    { bg: 'rgba(6,182,212,0.15)', border: '#06b6d4', text: '#67e8f9' },
    { bg: 'rgba(16,185,129,0.15)', border: '#10b981', text: '#6ee7b7' },
    { bg: 'rgba(245,158,11,0.15)', border: '#f59e0b', text: '#fcd34d' },
    { bg: 'rgba(239,68,68,0.15)', border: '#f97316', text: '#fdba74' },
    { bg: 'rgba(99,102,241,0.15)', border: '#6366f1', text: '#a5b4fc' },
    { bg: 'rgba(236,72,153,0.15)', border: '#ec4899', text: '#f9a8d4' },
  ];

  const TOPICS = {
    hard: ['Core Concepts', 'Problem Sets', 'Deep Review', 'Practice Exam', 'Weak Areas', 'Formula Revision'],
    medium: ['Chapter Review', 'Practice Questions', 'Key Topics', 'Summary Notes', 'Past Papers'],
    easy: ['Quick Review', 'Flash Cards', 'Light Reading', 'Note Summary'],
  };

  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  // ─── ADD COURSE ───────────────────────────────────────────────────────────────
  function addCourse() {
    const name = document.getElementById('courseName').value.trim();
    const deadline = document.getElementById('courseDeadline').value;
    const difficulty = document.getElementById('courseDifficulty').value;

    if (!name) return shake('courseName');
    if (!deadline) return shake('courseDeadline');

    const deadlineDate = new Date(deadline);
    const today = new Date(); today.setHours(0,0,0,0);
    if (deadlineDate < today) {
      alert('⚠️ Please choose a future deadline date!');
      return;
    }

    const course = {
      id: Date.now(),
      name,
      deadline,
      difficulty,
      color: COLORS[courses.length % COLORS.length],
      daysLeft: Math.ceil((deadlineDate - today) / (1000*60*60*24))
    };
    courses.push(course);
    renderCourseList();
    document.getElementById('courseName').value = '';
    document.getElementById('courseDeadline').value = '';
  }

  function shake(id) {
    const el = document.getElementById(id);
    el.style.borderColor = '#e94560';
    el.style.animation = 'none';
    setTimeout(() => { el.style.borderColor = ''; }, 1500);
  }

  function removeCourse(id) {
    courses = courses.filter(c => c.id !== id);
    renderCourseList();
  }

  function renderCourseList() {
    const list = document.getElementById('courseList');
    if (courses.length === 0) { list.innerHTML = ''; return; }
    list.innerHTML = courses.map(c => `
      <div class="course-item" id="ci-${c.id}">
        <div class="course-info">
          <div class="course-dot" style="background:${c.color.border}"></div>
          <div>
            <div class="course-name">${c.name}</div>
            <div class="course-meta">
              ${c.difficulty.charAt(0).toUpperCase()+c.difficulty.slice(1)} difficulty
              • ${c.daysLeft} day${c.daysLeft!==1?'s':''} left
            </div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="deadline-badge">📅 ${formatDate(c.deadline)}</span>
          <button class="btn-remove" onclick="removeCourse(${c.id})">✕</button>
        </div>
      </div>
    `).join('');
  }

  // ─── GENERATE SCHEDULE ───────────────────────────────────────────────────────
  function generateSchedule() {
    if (courses.length === 0) {
      alert('📚 Please add at least one course first!');
      return;
    }

    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    const sessionLen = parseInt(document.getElementById('sessionLen').value);
    const breakLen = parseInt(document.getElementById('breakLen').value);
    const weeks = parseInt(document.getElementById('scheduleWeeks').value);
    const restDaysEl = document.getElementById('restDays');
    const restDays = Array.from(restDaysEl.selectedOptions).map(o => parseInt(o.value));

    const [sh, sm] = startTime.split(':').map(Number);
    const [eh, em] = endTime.split(':').map(Number);
    const totalMinutes = (eh * 60 + em) - (sh * 60 + sm);
    const slotSize = sessionLen + breakLen;
    const slotsPerDay = Math.floor(totalMinutes / slotSize);

    // Priority scoring: harder + sooner deadline = higher priority
    const today = new Date(); today.setHours(0,0,0,0);
    const priorityMap = { hard: 3, medium: 2, easy: 1 };
    const scored = courses.map(c => {
      const dl = new Date(c.deadline);
      const days = Math.max(1, Math.ceil((dl - today) / 86400000));
      return { ...c, priority: priorityMap[c.difficulty] * (1 / days) * 1000, days };
    }).sort((a, b) => b.priority - a.priority);

    // Build schedule day by day
    generatedSchedule = [];
    const topicCounters = {};
    courses.forEach(c => topicCounters[c.id] = 0);

    for (let d = 0; d < weeks * 7; d++) {
      const date = new Date(today);
      date.setDate(today.getDate() + d);
      const dayOfWeek = date.getDay();

      if (restDays.includes(dayOfWeek)) continue;

      // Filter courses whose deadline hasn't passed
      const activeCourses = scored.filter(c => {
        const dl = new Date(c.deadline);
        return date <= dl;
      });
      if (activeCourses.length === 0) continue;

      const daySessions = [];
      let currentMin = sh * 60 + sm;

      for (let slot = 0; slot < slotsPerDay; slot++) {
        if (activeCourses.length === 0) break;
        const course = activeCourses[slot % activeCourses.length];
        const startMin = currentMin;
        const endMin = currentMin + sessionLen;

        // Calculate priority label
        const daysLeft = Math.max(1, Math.ceil((new Date(course.deadline) - date) / 86400000));
        let pLabel = 'low';
        if (daysLeft <= 3) pLabel = 'high';
        else if (daysLeft <= 7) pLabel = 'medium';

        const topicList = TOPICS[course.difficulty];
        const topic = topicList[topicCounters[course.id] % topicList.length];
        topicCounters[course.id]++;

        daySessions.push({
          course,
          start: minToTime(startMin),
          end: minToTime(endMin),
          startMin,
          endMin,
          topic,
          priority: pLabel,
          daysLeft,
        });
        currentMin = endMin + breakLen;
        if (currentMin + sessionLen > eh * 60 + em) break;
      }

      if (daySessions.length > 0) {
        generatedSchedule.push({ date, dayOfWeek, sessions: daySessions });
      }
    }

    renderOutput(weeks);
  }

  // ─── RENDER OUTPUT ────────────────────────────────────────────────────────────
  function renderOutput(weeks) {
    const out = document.getElementById('scheduleOutput');

    // Count total hours
    const totalSessions = generatedSchedule.reduce((s, d) => s + d.sessions.length, 0);
    const sessionLen = parseInt(document.getElementById('sessionLen').value);
    const totalHours = Math.round((totalSessions * sessionLen) / 60);

    // Per-course hours
    const courseHours = {};
    courses.forEach(c => courseHours[c.id] = 0);
    generatedSchedule.forEach(day => {
      day.sessions.forEach(s => {
        courseHours[s.course.id] = (courseHours[s.course.id] || 0) + sessionLen;
      });
    });

    // Clashes check (no overlaps since we built sequentially — always 0)
    const clashes = 0;

    out.innerHTML = `
      <div class="schedule-output">

        <!-- ALERTS -->
        ${clashes === 0
          ? `<div class="alert alert-success">✅ Your schedule is 100% clash-free! ${totalSessions} sessions across ${generatedSchedule.length} study days generated.</div>`
          : `<div class="alert alert-warning">⚠️ ${clashes} potential overlaps detected and resolved automatically.</div>`
        }

        <!-- SCHEDULE CARD -->
        <div class="card">
          <div class="schedule-header">
            <h2>📅 Your Study Schedule</h2>
            <div style="display:flex;gap:12px;align-items:center;">
              <div class="stats">
                <span class="stat-pill">⏱ ${totalHours}h total</span>
                <span class="stat-pill">📋 ${totalSessions} sessions</span>
                <span class="stat-pill">📚 ${courses.length} courses</span>
              </div>
              <div class="view-toggle">
                <button class="view-btn ${currentView==='grid'?'active':''}" onclick="switchView('grid')">📆 Grid</button>
                <button class="view-btn ${currentView==='list'?'active':''}" onclick="switchView('list')">📋 List</button>
              </div>
            </div>
          </div>

          <!-- WEEK TABS -->
          <div class="week-tabs" id="weekTabs">
            ${Array.from({length: weeks}, (_,i) => `
              <button class="week-tab ${i===currentWeek?'active':''}" onclick="switchWeek(${i})">Week ${i+1}</button>
            `).join('')}
          </div>

          <div id="scheduleView"></div>
        </div>

        <!-- COURSE PROGRESS -->
        <div class="card">
          <h2>📊 Study Time Distribution</h2>
          <div class="progress-section">
            ${courses.map(c => {
              const mins = courseHours[c.id] || 0;
              const hrs = (mins/60).toFixed(1);
              const pct = totalHours > 0 ? Math.round((mins/60) / totalHours * 100) : 0;
              return `
                <div class="progress-item">
                  <div class="progress-label">
                    <span style="color:${c.color.text}">● ${c.name}</span>
                    <span>${hrs}h (${pct}%) · Deadline: ${formatDate(c.deadline)}</span>
                  </div>
                  <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width:${pct}%;background:${c.color.border}"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

      </div>
    `;

    renderWeekView();
  }

  function switchWeek(w) {
    currentWeek = w;
    document.querySelectorAll('.week-tab').forEach((t,i) => {
      t.classList.toggle('active', i === w);
    });
    renderWeekView();
  }

  function switchView(v) {
    currentView = v;
    document.querySelectorAll('.view-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.includes(v === 'grid' ? 'Grid' : 'List'));
    });
    renderWeekView();
  }

  function renderWeekView() {
    const today = new Date(); today.setHours(0,0,0,0);
    const weekStart = currentWeek * 7;
    const weekDays = generatedSchedule.filter(d => {
      const diff = Math.round((d.date - today) / 86400000);
      return diff >= weekStart && diff < weekStart + 7;
    });

    const view = document.getElementById('scheduleView');
    if (!view) return;

    if (currentView === 'grid') {
      renderGridView(view, weekDays, today);
    } else {
      renderListView(view, weekDays);
    }
  }

  function renderGridView(view, weekDays, today) {
    // Build a 7-column layout for the week
    const weekStart = new Date(today);
    weekStart.setDate(today.getDate() + currentWeek * 7);

    let cols = '';
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate() + i);
      const isToday = d.toDateString() === today.toDateString();
      const dayData = weekDays.find(w => w.date.toDateString() === d.toDateString());

      cols += `
        <div class="day-col">
          <div class="day-header ${isToday ? 'today' : ''}">
            ${DAYS[d.getDay()]}<br/>
            <span style="font-size:0.9em">${d.getDate()}</span>
          </div>
          ${dayData
            ? dayData.sessions.map(s => `
                <div class="session-block"
                  style="background:${s.course.color.bg};border-color:${s.course.color.border}">
                  <span class="priority-badge priority-${s.priority}">${s.priority}</span>
                  <div class="session-time">${s.start}–${s.end}</div>
                  <div class="session-course" style="color:${s.course.color.text}">${s.course.name}</div>
                  <div class="session-topic">${s.topic}</div>
                  <div class="session-duration">⏱ ${document.getElementById('sessionLen').value}min</div>
                </div>
              `).join('')
            : `<div style="text-align:center;padding:20px 4px;color:#333;font-size:0.75rem;">Rest Day 😴</div>`
          }
        </div>
      `;
    }

    view.innerHTML = `<div class="day-grid">${cols}</div>`;
  }

  function renderListView(view, weekDays) {
    if (weekDays.length === 0) {
      view.innerHTML = `<div class="empty-state"><div class="icon">😴</div><p>All rest days this week!</p></div>`;
      return;
    }
    let html = '';
    weekDays.forEach(day => {
      html += `
        <div style="margin-bottom:20px">
          <div style="font-size:0.85rem;color:#aaa;margin-bottom:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;">
            ${DAYS[day.dayOfWeek]}, ${day.date.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
          </div>
          <div class="timeline">
            ${day.sessions.map(s => `
              <div class="timeline-item">
                <div class="timeline-time">${s.start}<br/><span style="font-size:0.7rem;color:#555">${s.end}</span></div>
                <div class="timeline-bar" style="background:${s.course.color.border}"></div>
                <div class="timeline-content">
                  <div class="timeline-course" style="color:${s.course.color.text}">${s.course.name}</div>
                  <div class="timeline-detail">
                    📖 ${s.topic} &nbsp;·&nbsp;
                    ⏱ ${document.getElementById('sessionLen').value}min &nbsp;·&nbsp;
                    📅 ${s.daysLeft} days to deadline &nbsp;·&nbsp;
                    <span class="priority-badge priority-${s.priority}" style="display:inline">${s.priority} priority</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    });
    view.innerHTML = html;
  }

  // ─── HELPERS ──────────────────────────────────────────────────────────────────
  function minToTime(min) {
    const h = Math.floor(min / 60);
    const m = min % 60;
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hh = h > 12 ? h - 12 : (h === 0 ? 12 : h);
    return `${hh}:${m.toString().padStart(2,'0')} ${ampm}`;
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ─── KEYBOARD SHORTCUT ────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('courseName') === document.activeElement) {
      addCourse();
    }
  });

  // Set default date to tomorrow
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 7);
  document.getElementById('courseDeadline').value = tomorrow.toISOString().split('T')[0];
</script>
</body>
</html>
